<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>책짓기 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
/* Layout: 차분한 녹회색 작업 책상(UI) 위에 하얀 책 면만 밝게 놓인다. 위 단계 막대 → 단계별 작업 영역. */
:root{
  --bg:#EEF1EE; --surface:#FFFFFF; --surface-2:#E3E8E4; --ink:#18211D; --muted:#56635C; --line:#CDD6D0;
  --accent:#1F5C4A; --accent-ink:#FFFFFF; --accent-soft:#D6E7DF;
  --warn:#8A5A00; --warn-soft:#FAEFD6; --stop:#A8261C; --stop-soft:#F9E1DE; --ok:#25704A; --ok-soft:#DDEFE3;
  --desk:#D7DED9; --paper:#FFFFFF; --paper-ink:#1B1B1B; --paper-mute:#6F6F6F; --guide:#2F8C6E;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --serif-book:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
  --sans-book:"Nanum Gothic","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --display:"Nanum Myeongjo","AppleMyungjo","Batang",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1A211E; --surface-2:#232C28; --ink:#E4EBE7; --muted:#9BAAA2; --line:#2F3A35;
  --accent:#7CC3A6; --accent-ink:#0D1A14; --accent-soft:#1E3A2F;
  --warn:#E2B356; --warn-soft:#352A13; --stop:#F08A80; --stop-soft:#3A1C19; --ok:#86CFA2; --ok-soft:#1C3326;
  --desk:#0B0F0D; --paper:#F3F1EB; --paper-ink:#1B1B1B; --paper-mute:#666666; --guide:#3FA884; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1A211E; --surface-2:#232C28; --ink:#E4EBE7; --muted:#9BAAA2; --line:#2F3A35;
  --accent:#7CC3A6; --accent-ink:#0D1A14; --accent-soft:#1E3A2F;
  --warn:#E2B356; --warn-soft:#352A13; --stop:#F08A80; --stop-soft:#3A1C19; --ok:#86CFA2; --ok-soft:#1C3326;
  --desk:#0B0F0D; --paper:#F3F1EB; --paper-ink:#1B1B1B; --paper-mute:#666666; --guide:#3FA884; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.wrap{max-width:1240px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.modes{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:999px}
.modes button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;line-height:1.3;text-align:left}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.small{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.stop{background:var(--stop-soft);color:var(--stop)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.term{border-bottom:1px dotted var(--muted);cursor:help;position:relative}
.term:hover::after,.term:focus::after{content:"출판 용어: " attr(data-term);position:absolute;left:0;top:calc(100% + 6px);background:var(--ink);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:20;font-weight:400}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* stepper */
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.crumb{display:flex;align-items:center;gap:8px;min-width:0}
.crumb .bk{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
.steps button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:6px 10px 6px 6px;border-radius:999px;cursor:pointer;color:var(--muted)}
.steps .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums;background:var(--surface)}
.steps .done .n{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.steps .cur button{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.steps .cur .n{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button:disabled{cursor:default;opacity:.55}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.sec-title{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.04em;margin:0 0 10px}
.lead{font-size:20px;font-weight:600;margin-bottom:4px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}

/* library */
.lib-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:8px 0 22px}
.lib-head h1{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.01em}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.book{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.book .shelf{background:var(--desk);border-radius:8px;height:190px;display:grid;place-items:center;overflow:hidden}
.book h3{font-size:18px}
.book .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.book .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.book.new{border-style:dashed;align-items:center;justify-content:center;text-align:center;min-height:300px;cursor:pointer;background:transparent}
.book.new:hover{border-color:var(--accent)}
.book.new .plus{font-size:34px;line-height:1;color:var(--accent)}
.mini-cover{width:96px;height:140px;background:var(--paper);color:var(--paper-ink);font-family:var(--serif-book);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.18);font-size:12px;text-align:center;padding:8px}
.mini-cover b{font-size:14px}
.how{margin-top:28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;list-style:none;padding:0}
.how li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.how .n{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600;font-size:13px}

/* input */
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid-in{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500}
.field input,.field select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%}
.trims{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.trim{border:1px solid var(--line);border-radius:10px;padding:12px 10px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.trim[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.trim .shape{background:var(--paper);border:1px solid var(--line);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.trim .shape-box{height:84px;display:flex;align-items:flex-end}
.trim b{font-size:14px}
.trim span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
textarea#ms{height:360px;resize:vertical;font-family:var(--serif-book);line-height:1.75;font-size:14px}
.help{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:10px}
.help code{font-family:var(--ui);background:var(--surface);padding:0 5px;border-radius:4px;color:var(--ink)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:40px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.has{border-color:var(--accent);background:var(--accent-soft)}

/* toc */
.toc-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
.zone{margin-bottom:18px}
.zone h3{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.row{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:6px;cursor:pointer}
.row.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.row.locked{background:transparent;border-style:dashed;cursor:default;grid-template-columns:118px minmax(0,1fr) auto}
.row select,.row input{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
.row .info{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.row .ops{display:flex;gap:2px}
.row .ops .btn{padding:3px 7px}
.weak{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:6px 10px;margin-top:4px}
.weak b{color:var(--warn)}
.excerpt{max-height:560px;overflow:auto;font-family:var(--serif-book);font-size:14px;line-height:1.8}
.excerpt .xb{position:relative;padding:6px 8px;border-radius:6px}
.excerpt .xb:hover{background:var(--surface-2)}
.excerpt .xb .btn{position:absolute;right:6px;top:-12px;display:none;font-family:var(--ui)}
.excerpt .xb:hover .btn,.excerpt .xb:focus-within .btn{display:inline-flex}
.excerpt h4{margin:0;font-size:15px}
.excerpt .xi{font-family:var(--ui);font-size:13px;color:var(--muted)}

/* design */
.design-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.presets{display:grid;gap:8px}
.preset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);cursor:pointer;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--accent-soft)}
.preset .sw{width:44px;height:56px;background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.preset small{display:block;color:var(--muted);font-size:12px}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.ctl:first-of-type{border-top:0}
.ctl .lbl{font-size:14px}
.ctl .lbl small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.switch{position:relative;width:44px;height:26px;border-radius:999px;border:0;background:var(--line);cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{left:21px}
.stage{background:var(--desk);border-radius:12px;padding:20px 12px;min-width:0}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.explain{font-size:13px;color:var(--muted);margin-top:10px}

/* spreads */
.spread{display:flex;justify-content:center;align-items:flex-start}
.spread.stack{flex-direction:column;align-items:center;gap:14px}
.side{display:flex;flex-direction:column;align-items:center;gap:8px}
.pw{position:relative;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pw.none{box-shadow:none;background:transparent}
.spread:not(.stack) .side.verso .pw:not(.none)::after,.spread:not(.stack) .side.recto .pw:not(.none)::after{content:"";position:absolute;top:0;bottom:0;width:22px;pointer-events:none}
.spread:not(.stack) .side.verso .pw::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.16),transparent)}
.spread:not(.stack) .side.recto .pw::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.12),transparent)}
.pw.clickable{cursor:pointer}
.pw.clickable:hover{box-shadow:0 0 0 2px var(--accent)}
.plabel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:22px}
.navbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.navbar .count{font-variant-numeric:tabular-nums;font-size:14px;min-width:96px;text-align:center}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:12px 2px 6px}
.thumb{border:0;background:transparent;padding:4px;border-radius:6px;cursor:pointer;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumb[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.thumb .spread .pw{box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* check */
.check-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:16px;align-items:start}
.issue{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px}
.issue .dot{width:10px;height:10px;border-radius:50%;margin-top:7px}
.issue.stop .dot{background:var(--stop)} .issue.warn .dot{background:var(--warn)} .issue.ok .dot{background:var(--ok)}
.issue .where{font-size:12px;color:var(--muted)}
.issue .hint{font-size:13px;color:var(--muted)}
.grp{font-size:14px;font-weight:600;margin:16px 0 8px;display:flex;gap:8px;align-items:center}
.grp:first-child{margin-top:0}
.export{display:flex;flex-direction:column;gap:12px}
.out{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.out dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0;font-size:13px}
.out dt{color:var(--muted)} .out dd{margin:0;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;animation:fill 1.3s ease-out forwards}
@keyframes fill{to{width:100%}}
.ready{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 10px;font-size:13px}

/* studio */
.studio{display:grid;grid-template-columns:220px minmax(0,1fr) 300px;gap:16px;align-items:start}
.st-toc{display:flex;flex-direction:column;gap:2px}
.st-toc .z{font-size:12px;color:var(--muted);margin:10px 0 2px;font-weight:600}
.st-toc .z:first-child{margin-top:0}
.st-toc button.it{border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;gap:6px;justify-content:space-between;align-items:center}
.st-toc button.it:hover{background:var(--surface-2)}
.st-toc button.it[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.st-head{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.st-head input{font-family:var(--serif-book);font-size:22px;font-weight:700;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 0;flex:1;min-width:0}
.toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:6px;background:var(--surface-2);border-radius:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-bottom:12px}
.toolbar .sep{width:1px;background:var(--line);margin:2px 4px}
.ed{font-family:var(--serif-book);font-size:16px;line-height:1.85;display:flex;flex-direction:column;gap:10px}
.eb{border-radius:6px;padding:4px 8px;outline:none;position:relative}
.eb[contenteditable="true"]:hover{background:var(--surface-2)}
.eb[contenteditable="true"]:focus{background:var(--surface-2);box-shadow:0 0 0 1px var(--line) inset}
.ed-p{text-indent:1em}
.ed-h{font-weight:700;font-size:18px}
.ed-h.weakh::before{content:"장 후보";font-family:var(--ui);font-size:11px;font-weight:500;color:var(--warn);background:var(--warn-soft);border-radius:99px;padding:1px 7px;margin-right:8px;vertical-align:middle}
.ed-q{margin-left:1.5em;padding-left:14px;border-left:3px solid var(--line);font-size:15px}
.ed-br{text-align:center;letter-spacing:.6em;color:var(--muted);font-family:var(--ui)}
.ed sup.nref{font-family:var(--ui);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 5px;margin:0 1px;cursor:pointer;vertical-align:super;line-height:1}
.ed-img{margin:0;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;font-family:var(--ui);font-size:14px}
.ed-img .art{background:center/cover no-repeat;border-radius:4px;aspect-ratio:4/3}
.ed-img .ctl2{display:flex;flex-direction:column;gap:8px;min-width:0}
.ed-img input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);width:100%}
.del{position:absolute;right:6px;top:6px}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--warn)}100%{box-shadow:0 0 0 3px transparent}}
.notes-panel{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.note{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.note .no{font-size:12px;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:1px 7px;margin-top:6px;font-variant-numeric:tabular-nums}
.note textarea{min-height:64px;font-size:13px;resize:vertical}
.mini{background:var(--desk);border-radius:10px;padding:12px 6px;min-height:120px}

/* plan */
.plan{max-width:860px;margin:0 auto}
.plan h1{font-family:var(--display);font-weight:800;font-size:32px;margin-bottom:6px}

const SAMPLE = `여는 글

이 책은 내가 열 살부터 열네 살까지 여름과 겨울을 보낸 남해의 작은 마을에 관한 이야기다. 그곳에는 할머니가 있었고, 바다가 있었고, 하루에 두 번 들어오는 버스가 있었다. 나는 그 버스를 타고 마을에 들어갔다가, 방학이 끝나면 같은 버스를 타고 도시로 돌아왔다.

오랫동안 이 이야기를 쓰지 못했다. 쓰려고 앉으면 기억이 너무 많거나 너무 적었다. 할머니가 돌아가시고 십 년이 지난 어느 봄, 서랍에서 할머니가 보내 준 편지 묶음을 찾았다. 맞춤법이 틀린 짧은 편지들이었는데, 한 장 한 장이 그 마을의 냄새를 품고 있었다. 그날부터 조금씩 적기 시작했다.

기억은 정확하지 않다. 날짜가 틀렸을 수도 있고, 두 해의 여름이 하나로 섞였을 수도 있다. 그래도 바다의 색과 부엌의 소리만큼은 틀리지 않았다고 믿는다.

제1장 바다로 가는 길

버스는 읍내 정류장에서 오후 두 시에 출발했다. 운전기사 아저씨는 승객의 얼굴을 다 알았고, 처음 보는 아이가 타면 누구네 손주냐고 물었다. 내가 할머니 이름을 대자 아저씨는 고개를 끄덕이며 맨 앞자리를 가리켰다. 거기 앉아야 바다가 제일 먼저 보인다고 했다.

길은 산허리를 따라 구불구불 이어졌다. 창문을 열면 송진 냄새와 마른 흙냄새가 번갈아 들어왔다. 고개를 하나 넘을 때마다 아저씨는 속도를 줄였고, 나는 그때마다 몸을 앞으로 내밀었다. 세 번째 고개를 넘자 갑자기 시야가 열리면서 바다가 나타났다. 생각했던 것보다 훨씬 파랗고, 훨씬 넓었다.

[그림: 버스 창문으로 처음 본 남해 바다]

마을은 바다와 산 사이에 좁게 끼어 있었다. 집이 서른 채쯤 되는 작은 마을이었다[주: 경상남도 남해군 서쪽 끝의 어촌. 지금은 다리가 놓여 읍내에서 차로 이십 분이면 들어간다.]. 정류장이라고 해 봐야 구멍가게 앞 평상 하나가 전부였다. 할머니는 그 평상에 앉아 부채질을 하고 계셨다. 나를 보자마자 일어나 손을 잡았는데, 그 손에서 생선 비린내와 비누 냄새가 같이 났다.

할머니 집은 정류장에서 골목을 두 번 꺾어 들어간 곳에 있었다. 대문은 늘 열려 있었고, 마당에는 빨랫줄과 고추를 말리는 멍석이 있었다. 마루에 가방을 내려놓자 할머니는 수박부터 잘라 왔다. 우물에 담가 두었던 수박은 이가 시릴 만큼 차가웠다.

그날 저녁 할머니는 나를 데리고 방파제까지 걸었다. 해가 지는 쪽 하늘이 붉게 물들고, 배들이 하나둘 돌아오고 있었다. 할머니는 배마다 누구네 배인지 알려 주었다. 저건 김씨네, 저건 박씨네, 저 작은 건 혼자 사는 영감님 배. 나는 그 이름들을 다 외우지 못했지만, 그 목소리만은 오래 기억했다.

밤이 되자 파도 소리가 방 안까지 들어왔다. 도시에서는 한 번도 들어 본 적 없는 소리였다. 처음에는 무서워서 잠이 오지 않았는데, 할머니가 옆에서 부채를 부쳐 주는 동안 나도 모르게 잠이 들었다. 그 여름 내내 나는 그 소리를 들으며 잠들었다.

제2장 할머니의 부엌

할머니의 부엌은 집에서 가장 어둡고 가장 따뜻한 곳이었다. 흙바닥에 아궁이가 두 개 있었고, 벽에는 그을음이 까맣게 앉아 있었다. 작은 창으로 들어오는 빛이 솥뚜껑 위에서 반짝였다. 할머니는 새벽 다섯 시면 그 부엌에 불을 지폈다.

[그림: 할머니의 부엌, 아궁이 앞]

부엌에서 가장 중요한 것은 장독대로 통하는 뒷문 옆의 항아리들이었다. 된장, 고추장, 간장, 그리고 멸치젓[주: 봄에 잡은 멸치를 소금에 버무려 항아리에 담아 두면 여름을 지나며 삭는다. 할머니는 해마다 오월에 멸치를 사서 직접 담갔는데, 소금의 양은 저울 없이 손으로만 가늠했다. 잘 삭은 젓국은 맑은 갈색이 되고, 건더기는 거의 다 녹아 없어진다. 할머니는 그 젓국으로 김치를 담그고 나물을 무쳤다.]. 할머니는 항아리 뚜껑을 열 때마다 냄새를 맡아 보고 혼자 고개를 끄덕였다.

나는 부엌일을 돕는다는 핑계로 늘 할머니 곁에 있었다. 실제로 내가 한 일은 마늘 껍질을 까거나 콩나물 꼬리를 따는 정도였다. 할머니는 그것도 일이라며 칭찬해 주었고, 나는 그 칭찬이 좋아서 다음 날 또 부엌에 갔다.

어느 일요일

일요일이면 할머니는 읍내 장에 갔다. 버스를 타고 가서 버스를 타고 돌아오는 데 반나절이 걸렸다. 혼자 남은 나는 부엌 문턱에 앉아 할머니를 기다렸다. 아궁이에는 불씨가 남아 있었고, 솥에서는 아침에 안쳐 둔 보리차가 식어 가고 있었다.

할머니가 장에서 돌아오면 장바구니에는 늘 같은 것들이 들어 있었다. 두부 한 모, 고등어 두 마리, 그리고 나를 위한 눈깔사탕 한 봉지. 할머니는 고등어를 소금에 절여 두고, 저녁에 아궁이 불에 구웠다. 껍질이 바삭하게 탄 고등어를 할머니는 가시를 다 발라 내 밥 위에 올려 주었다.

지금도 고등어를 구우면 그 부엌이 생각난다. 우리 집 부엌은 밝고 깨끗하고 가스레인지 불은 파랗다. 그래도 연기 냄새가 조금 나면, 나는 잠깐 그 어두운 부엌 문턱에 앉아 있는 기분이 든다.

제3장 겨울 항구

겨울방학에 마을에 가는 것은 여름과 전혀 다른 일이었다. 버스 창문에는 김이 서렸고, 바다는 파랗지 않고 회색이었다. 항구에는 배들이 줄지어 묶여 있었다. 바람이 세게 부는 날에는 아무도 바다에 나가지 않았다.

[그림: 바람 부는 날의 겨울 항구]

겨울의 할머니는 여름보다 말이 적었다. 아침이면 마당의 물독에 언 얼음을 깨고, 낮에는 방에서 그물을 손질했다. 나는 할머니 옆에서 숙제를 하는 척하며 그 손을 구경했다. 굵은 바늘이 그물코 사이를 오가는 속도가 너무 빨라서 따라 볼 수가 없었다.

중학생이 되던 해 겨울, 할머니에게 휴대전화가 생겼다. 서울의 고모가 사 드린 것이었다. 할머니는 글자 쓰는 법을 끝내 익히지 못했지만, 그해 설날 아침 나에게 처음으로 문자를 보냈다. 화면에는 하트 이모티콘 ❤️ 하나만 덩그러니 있었다. 나는 그 문자를 지우지 못하고 휴대전화를 세 번 바꾸는 동안 옮겨 두었다.

그 겨울이 할머니 집에서 보낸 마지막 방학이었다. 다음 해부터는 학원이 있었고, 그다음 해에는 할머니가 고모 집으로 옮겨 가셨다. 마을의 집은 몇 년 동안 비어 있다가 팔렸다. 나는 그 소식을 전화로 들었고, 그날 밤 오래 잠들지 못했다.

몇 해 전 그 마을에 다시 가 보았다. 다리가 놓여 버스 대신 차를 타고 들어갔다. 구멍가게는 편의점이 되었고, 평상은 없어졌다. 할머니 집 자리에는 하얀 펜션이 서 있었다. 방파제까지 걸어가니 해가 지고 있었고, 배들이 돌아오고 있었다. 나는 그 배들이 누구네 배인지 하나도 알지 못했다.

닫는 글

이 이야기를 쓰는 동안 여러 번 그만두고 싶었다. 기억을 꺼내는 일이 생각보다 아팠기 때문이다. 그래도 마지막 장을 쓰고 나니 할머니가 조금 더 가까이 있는 것 같다. 이 책을 읽는 누군가도 자기만의 바다와 부엌을 떠올렸으면 좋겠다.

};
const ART_ORDER = ['sea','kitchen','harbor'];
function artFor(caption){ if(/바다/.test(caption)) return 'sea'; if(/부엌|아궁이/.test(caption)) return 'kitchen'; if(/항구|배/.test(caption)) return 'harbor'; return ART_ORDER[(artSeq++)%3]; }

const TRIMS = {

};
const SIZE_ADJ = {small:-.5, normal:0, large:1};
const SPACE_ADJ = {narrow:-.12, normal:0, wide:.15};
const KINDS = {
  prologue:{label:'여는 글', zone:'front'}, dedication:{label:'헌사', zone:'front'},
  part:{label:'부 표지', zone:'body'}, chapter:{label:'장', zone:'body'},

};
const ZONES = {front:'앞부분', body:'본문', back:'뒷부분'};
const ZORDER = {front:0, body:1, back:2};
const FB = {'프롤로그':'prologue','여는 글':'prologue','들어가며':'prologue','머리말':'prologue','작가의 말':'prologue','에필로그':'epilogue','닫는 글':'epilogue','나가며':'epilogue','맺음말':'epilogue','감사의 글':'thanks','고마운 분들':'thanks','작가 소개':'author','지은이 소개':'author'};
const STEPS = [{id:'input',label:'원고 넣기'},{id:'toc',label:'차례 확인'},{id:'design',label:'책 꾸미기'},{id:'preview',label:'미리보기'},{id:'check',label:'점검·내보내기'}];

/* ===================== 상태 ===================== */
let idSeq = 0, noteSeq = 0;
const uid = () => 's' + (++idSeq);
const S = {
  mode:'proto', view:'library', furthest:3,
  meta:{title:'바다로 가는 길', author:'김여름'},
  trim:'shinguk',
  design:{preset:'essay', size:'normal', spacing:'normal', font:'serif', rightStart:true, folio:'outer', head:true, notes:'page', frontNum:'hidden'},
  sections:[], notes:{},
  sel:null, spread:0, designFocus:'opener', gray:false, guides:false,

  edFocus:null, savedRange:null, focusBlock:null, lastDeleted:null,
};

/* ===================== 원고 읽기 (장 자동 인식) ===================== */
function parseManuscript(raw, src){
  const lines = raw.replace(/\r/g,'').split('\n');
  const sections = []; let cur = null;
  const isDocx = src === 'docx';
  const push = (kind, title, reason) => { cur = {id:uid(), kind, title, reason, blocks:[]}; sections.push(cur); };
  const ensure = () => { if(!cur) push('chapter', '제목 없는 글', '장 제목 앞에 있던 글'); };
  const notesOut = {};
  const takeNotes = t => t.replace(/\s*\[주:\s*([^\]]+)\]/g, (_, body) => { const id = 'n' + (++noteSeq); notesOut[id] = body.trim(); return `{{${id}}}`; });
  for(let i = 0; i < lines.length; i++){
    const line = lines[i].trim(); if(!line) continue;
    const prevBlank = i === 0 || !lines[i-1].trim();
    const nextBlank = i === lines.length - 1 || !lines[i+1].trim();
    let m;
    if(line.length <= 40 && (m = line.match(/^(?:제\s*\d+\s*장|\d+\s*장|chapter\s+\d+)\s*[.:·\-]?\s*(.*)$/i))){
      let title = m[1].trim();
      if(!title){ let j = i + 1; while(j < lines.length && !lines[j].trim()) j++; if(j < lines.length && lines[j].trim().length <= 30){ title = lines[j].trim(); i = j; } }
      const word = line.split(/\s+/)[0];
      push('chapter', title || '제목 없음', isDocx ? '워드 ‘제목 1’ 스타일' : `‘${word}’로 시작하는 줄`); continue;
    }
    if((m = line.match(/^#\s+(.+)$/))){ push('chapter', m[1].trim(), '‘#’ 제목 표시'); continue; }
    if(FB[line]){ push(FB[line], line, isDocx ? '워드 ‘제목 1’ 스타일' : `‘${line}’라는 제목`); continue; }
    if((m = line.match(/^##\s+(.+)$/))){ ensure(); cur.blocks.push({t:'h', text:m[1]}); continue; }
    if((m = line.match(/^\[그림:\s*([^\]]*)\]$/))){ ensure(); const cap = m[1].trim(); cur.blocks.push({t:'img', art:artFor(cap), size:'body', caption:cap}); continue; }
    if(/^(\*\s*){3,}$/.test(line)){ ensure(); cur.blocks.push({t:'break'}); continue; }
    if(line.startsWith('>')){ ensure(); cur.blocks.push({t:'q', text:takeNotes(line.replace(/^>\s*/,''))}); continue; }
    if(cur && prevBlank && nextBlank && line.length <= 30 && !/[.?!。…"”’)\]]$/.test(line)){
      cur.blocks.push({t:'h', text:line, weak:!isDocx}); continue;
    }
    ensure(); cur.blocks.push({t:'p', text:takeNotes(line.replace(/\s+/g,' '))});
  }
  return {sections, notes:notesOut};
}
const zoneOf = s => KINDS[s.kind].zone;
function normalize(){ S.sections.sort((a,b) => ZORDER[zoneOf(a)] - ZORDER[zoneOf(b)]); }
function chapterNo(sec){ if(sec.kind !== 'chapter') return 0; return S.sections.filter(s => s.kind === 'chapter').indexOf(sec) + 1; }
function secLabel(sec){ const n = chapterNo(sec); return n ? `${n}장 ${sec.title}` : sec.title; }
function loadBook(raw, src){
  const r = parseManuscript(raw, src);
  S.sections = r.sections; S.notes = r.notes; normalize();
  S.sel = (S.sections.find(s => s.kind === 'chapter') || S.sections[0] || {}).id || null;
  invalidate();
}

/* ===================== 조판기 (쪽 나누기) ===================== */
const K = 3, PT = 0.3528; // 1mm = 3px (기준 배율), 1pt = 0.3528mm
let LAYOUT = null, dirty = true;
function invalidate(){ dirty = true; }
function getLayout(){ if(dirty || !LAYOUT){ LAYOUT = paginate(); dirty = false; } return LAYOUT; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const refsIn = t => [...String(t).matchAll(/\{\{(n\d+)\}\}/g)].map(m => m[1]);

function dims(){
  const t = TRIMS[S.trim], p = PRESETS[S.design.preset];
  const fsPt = p.fs + SIZE_ADJ[S.design.size];
  const lh = +(p.lh + SPACE_ADJ[S.design.spacing]).toFixed(2);
  const [mt, mb, mi, mo] = t.m;
  return {t, p, W:t.w*K, H:t.h*K, top:mt*K, bottom:mb*K, inner:mi*K, outer:mo*K, fsPx:fsPt*PT*K, fsPt, lh,
    font: S.design.font === 'serif' ? 'var(--serif-book)' : 'var(--sans-book)', bodyWmm:t.w-mi-mo, bodyHmm:t.h-mt-mb};
}

function paginate(){
  const D = dims(); const host = document.getElementById('host'); host.innerHTML = '';
  const pages = []; let cur = null, curSec = null; const pending = [];
  const stats = {orphans:0, widows:0, deferred:0, blanks:0, keep:0};
  const lhPx = D.fsPx * D.lh;
  const order = S.sections.slice();
  // 주석 번호: 부분(장)마다 1부터
  const noteNo = {}, notesBySec = {};
  for(const sec of order){ let c = 0; notesBySec[sec.id] = []; for(const b of sec.blocks){ for(const id of refsIn(b.text || '')){ if(!(id in noteNo)){ noteNo[id] = ++c; notesBySec[sec.id].push(id); } } } }
  const inl = t => esc(t).replace(/\{\{(n\d+)\}\}/g, (_, id) => `<sup class="nref">${noteNo[id] ?? '*'}</sup>`);
  const mk = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; e.innerHTML = html; return e; };

  function makePage(kind, sec){
    if(pages.length > 600) throw new Error('too many pages');
    const phys = pages.length + 1, recto = phys % 2 === 1;
    const pg = document.createElement('div'); pg.className = 'pg ' + (recto ? 'recto' : 'verso');
    pg.style.cssText = `width:${D.W}px;height:${D.H}px;--fs:${D.fsPx}px;--lh:${D.lh};--bf:${D.font};--ind:${D.p.indent}em;--pgap:${D.p.gap}em`;
    const body = document.createElement('div'); body.className = 'pg-body';
    body.style.cssText = `left:${recto ? D.inner : D.outer}px;top:${D.top}px;width:${D.W-D.inner-D.outer}px;height:${D.H-D.top-D.bottom}px`;
    const flow = document.createElement('div'); flow.className = 'flow';
    const fn = document.createElement('div'); fn.className = 'fn';
    body.append(flow, fn); pg.append(body); host.append(pg);
    cur = {node:pg, body, flow, fn, phys, recto, kind, sec:sec ? sec.id : null, secTitle:sec ? secLabel(sec) : '', zone:sec ? zoneOf(sec) : 'front', full:false};
    pages.push(cur); return cur;
  }
  const over = () => cur.body.scrollHeight > cur.body.clientHeight + 1;
  const used = () => cur.flow.offsetHeight + cur.fn.offsetHeight;
  const isEmpty = () => !cur.flow.childElementCount && !cur.fn.childElementCount;
  const lines = e => Math.round(e.offsetHeight / (parseFloat(getComputedStyle(e).lineHeight) || lhPx));
  function newBodyPage(){ makePage('body', curSec); if(pending.length){ const items = pending.splice(0); for(const b of items) placeImage(b); } }
  function target(){ if(cur.full) newBodyPage(); }
  function addNotes(txt){ const added = []; if(S.design.notes === 'page'){ for(const id of refsIn(txt)){ const d = mk('div', 'fn-item', `<span class="fn-num">${noteNo[id]}</span><span>${inl(S.notes[id] || '')}</span>`); cur.fn.append(d); added.push(d); } } return added; }
  function put(e, txt){ cur.flow.append(e); return addNotes(txt); }
  function unput(e, added){ e.remove(); added.forEach(a => a.remove()); }

  function placeText(b, cont){
    target();
    const tag = b.t === 'q' ? 'blockquote' : 'p';
    const base = (b.t === 'en' ? 'en ' : '') + (cont ? 'cont ' : '');
    const e = mk(tag, base, inl(b.text)); const a = put(e, b.text);
    if(!over()) return;
    unput(e, a);
    const tok = b.text.split(' ');
    const tryN = n => { const txt = tok.slice(0, n).join(' '); const t = mk(tag, base + 'split', inl(txt)); const ad = put(t, txt); return {t, ad, ok:!over()}; };
    let lo = 0, hi = tok.length - 1;
    while(lo < hi){ const mid = Math.ceil((lo + hi) / 2); const r = tryN(mid); unput(r.t, r.ad); if(r.ok) lo = mid; else hi = mid - 1; }
    let n = lo;
    if(n > 0){
      let r = tryN(n);
      if(lines(r.t) < 2){ unput(r.t, r.ad); n = 0; stats.orphans++; }
      else {
        const restLines = k => { const t = mk(tag, base + 'cont', inl(tok.slice(k).join(' '))); cur.flow.append(t); const c = lines(t); t.remove(); return c; };
        if(restLines(n) < 2){
          unput(r.t, r.ad); let k = n; while(k > 1 && restLines(k) < 2) k--;
          r = tryN(k); if(lines(r.t) < 2){ unput(r.t, r.ad); n = 0; } else n = k;
          stats.widows++;
        }
      }
    }
    if(n === 0){
      if(isEmpty()){ put(mk(tag, base, inl(b.text)), b.text); return; }
      newBodyPage(); return placeText(b, cont);
    }
    newBodyPage();
    placeText({...b, text:tok.slice(n).join(' ')}, true);
  }
  function placeHeading(b, cls){
    target();
    const e = mk('h3', cls || '', inl(b.text)); cur.flow.append(e);
    if(over()){ e.remove(); newBodyPage(); cur.flow.append(e); return; }
    if(cur.body.clientHeight - used() < 2.2 * lhPx && cur.flow.childElementCount > 1){ e.remove(); stats.keep++; newBodyPage(); cur.flow.append(e); }
  }
  const figHTML = b => { const art = ARTS[b.art]; return `<div class="art" style="background-image:url('${art.uri}');${b.size === 'full' ? '' : `aspect-ratio:${(1/art.ratio).toFixed(3)}`}"></div>${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}`; };
  function placeImage(b){
    target();
    if(b.size === 'full'){
      if(!isEmpty()){ pending.push(b); stats.deferred++; return; }
      cur.kind = 'image'; const f = mk('figure', 'fig full', figHTML(b)); cur.flow.append(f); f.style.height = cur.body.clientHeight + 'px'; cur.full = true; return;
    }
    const f = mk('figure', 'fig ' + b.size, figHTML(b)); cur.flow.append(f);
    if(over()){ f.remove(); if(isEmpty()){ cur.flow.append(f); return; } pending.push(b); stats.deferred++; }
  }
  function placeBreak(){ target(); const e = mk('div', 'scene', '* * *'); cur.flow.append(e); if(over()){ e.remove(); newBodyPage(); cur.flow.append(e); } }
  function placeBlock(b){
    if(b.t === 'p' || b.t === 'q' || b.t === 'en'){ if((b.text || '').trim()) placeText(b, false); }
    else if(b.t === 'h') placeHeading(b);
    else if(b.t === 'img') placeImage(b);
    else if(b.t === 'break') placeBreak();
  }
  function startOn(recto){ if(recto && (pages.length + 1) % 2 === 0){ makePage('blank', null); stats.blanks++; } }
  let bodyStart = null; const secFirst = {};

  function flowSection(sec){
    curSec = sec;
    const right = S.design.rightStart || sec.kind === 'part' || (zoneOf(sec) === 'body' && bodyStart == null);
    startOn(right);
    if(zoneOf(sec) === 'body' && bodyStart == null) bodyStart = pages.length + 1;
    const n = chapterNo(sec);
    if(sec.kind === 'part'){ makePage('opener', sec); secFirst[sec.id] = pages.length - 1; cur.flow.append(mk('div', 'opener-full', `<div class="op-title">${esc(sec.title)}</div>`)); makePage('blank', null); return; }
    if(sec.kind === 'chapter' && D.p.opener === 'full'){
      makePage('opener', sec); secFirst[sec.id] = pages.length - 1;
      cur.flow.append(mk('div', 'opener-full', `<div class="op-num">${n}</div><div class="op-title">${esc(sec.title)}</div>`));
      makePage('body', sec);
    } else {
      makePage('opener', sec); secFirst[sec.id] = pages.length - 1;
      const num = n ? `<div class="op-num">${D.p.bigNum ? String(n).padStart(2, '0') : n + '장'}</div>` : '';
      const o = mk('div', 'opener' + (D.p.bigNum ? ' big' : ''), `${num}<div class="op-title">${esc(sec.title)}</div>`);
      o.style.height = (cur.body.clientHeight * 0.32) + 'px'; cur.flow.append(o);
    }
    for(const b of sec.blocks) placeBlock(b);
    if(S.design.notes === 'chapter' && notesBySec[sec.id].length){
      placeHeading({text:'주'}, 'enh');
      for(const id of notesBySec[sec.id]) placeText({t:'en', text:`${noteNo[id]}. ${S.notes[id] || ''}`}, false);
    }
    if(pending.length) newBodyPage();
  }

  // 앞부분: 속표지 → 판권 면 → 헌사 → 차례 → 여는 글
  makePage('title', null); cur.flow.append(mk('div', 'tp', `<div class="tp-title">${esc(S.meta.title || '제목 없는 책')}</div><div class="tp-author">${esc(S.meta.author || '지은이')} 지음</div>`));
  makePage('copyright', null);
  cur.flow.append(mk('div', 'cr', `<b>${esc(S.meta.title || '제목 없는 책')}</b><hr>초판 1쇄 펴낸 날 2026년 11월 2일<br>지은이 ${esc(S.meta.author || '')}<br>펴낸 곳 (작가가 입력)<br>ISBN (입력 전)<hr>이 책의 내용을 쓰려면 지은이의 허락을 받아야 합니다.`));
  const front = order.filter(s => zoneOf(s) === 'front');
  for(const s of front.filter(s => s.kind === 'dedication')){ startOn(true); makePage('dedication', s); secFirst[s.id] = pages.length - 1; cur.flow.append(mk('div', 'ded', s.blocks.map(b => inl(b.text || '')).join('<br>'))); }
  startOn(true); const tocPage = makePage('toc', null);
  for(const s of front.filter(s => s.kind !== 'dedication')) flowSection(s);
  for(const s of order.filter(s => zoneOf(s) === 'body')) flowSection(s);
  const back = order.filter(s => zoneOf(s) === 'back');
  let gen = null;
  if(S.design.notes === 'book' && Object.keys(noteNo).length){
    const blocks = [];
    for(const s of order){ if(!notesBySec[s.id].length) continue; blocks.push({t:'h', text:secLabel(s)}); for(const id of notesBySec[s.id]) blocks.push({t:'en', text:`${noteNo[id]}. ${S.notes[id] || ''}`}); }
    gen = {id:'gen-notes', kind:'booknotes', title:'책 끝 주석', blocks};
  }
  const backOrder = back.filter(s => s.kind !== 'author'); if(gen) backOrder.push(gen); backOrder.push(...back.filter(s => s.kind === 'author'));
  for(const s of backOrder) flowSection(s);
  if(bodyStart == null) bodyStart = pages.length + 1;
  const pad = (4 - pages.length % 4) % 4; for(let i = 0; i < pad; i++) makePage('pad', null);

  // 쪽 번호, 머리글
  const roman = n => ['i','ii','iii','iv','v','vi','vii','viii','ix','x','xi','xii','xiii','xiv','xv','xvi'][n-1] || String(n);
  for(const P of pages){
    const hide = ['blank','opener','title','copyright','pad','image','dedication'].includes(P.kind);
    P.folio = P.phys >= bodyStart ? P.phys - bodyStart + 1 : (S.design.frontNum === 'roman' ? roman(P.phys) : null);
    P.showFolio = !hide && P.folio != null;
    P.hasNotes = !!P.node.querySelector('.fn-item, p.en');
    const side = P.recto ? 'right' : 'left';
    const lineY = D.top * 0.42, footY = D.H - D.bottom * 0.62;
    if(P.showFolio){
      const f = mk('div', 'folio', String(P.folio)); const pos = S.design.folio;
      f.style.cssText = pos === 'center' ? `left:0;right:0;text-align:center;top:${footY}px` : pos === 'outer' ? `${side}:${D.outer}px;top:${footY}px` : `${side}:${D.outer}px;top:${lineY}px`;
      P.node.append(f);
    }
    if(S.design.head && !hide && P.kind !== 'toc' && P.sec){
      const h = mk('div', 'rh', esc(P.recto ? P.secTitle : (S.meta.title || '')));
      const off = S.design.folio === 'top' && P.showFolio ? `calc(${D.outer}px + 3em)` : `${D.outer}px`;
      h.style.cssText = `${side}:${off};top:${lineY}px`;
      P.node.append(h);
    }
  }
  // 차례 채우기
  const folioOf = id => secFirst[id] != null ? pages[secFirst[id]].folio : null;
  const tocRows = [...front.filter(s => s.kind !== 'dedication'), ...order.filter(s => zoneOf(s) === 'body'), ...backOrder].map(s => {
    const f = folioOf(s.id);
    return `<div class="toc-row ${zoneOf(s)}"><span>${esc(secLabel(s))}</span><span class="toc-dots"></span><span class="toc-n">${f ?? ''}</span></div>`;
  }).join('');
  tocPage.flow.innerHTML = `<div class="toc-h">차례</div>${tocRows}`;

  const spreads = [[null, 0]]; for(let i = 1; i < pages.length; i += 2) spreads.push([i, i + 1 < pages.length ? i + 1 : null]);
  return {pages, spreads, stats, D, secFirst, bodyStart, pad, total:pages.length, noteNo, notesBySec};
}
const spreadOf = idx => idx <= 0 ? 0 : Math.floor((idx + 1) / 2);

/* ===================== 펼침면 그리기 ===================== */
const KIND_BADGE = {blank:'빈 면', opener:'장 시작 면', pad:'인쇄용 빈 면', image:'그림 면', title:'속표지', copyright:'판권 면', toc:'차례', dedication:'헌사'};
function pageSlot(L, idx, s, opt){
  const P = L.pages[idx];
  const w = document.createElement('div'); w.className = 'pw' + (opt.click ? ' clickable' : '');
  w.style.width = L.D.W * s + 'px'; w.style.height = L.D.H * s + 'px';
  const c = P.node.cloneNode(true); c.style.position = 'absolute'; c.style.left = '0'; c.style.top = '0'; c.style.transform = `scale(${s})`; c.style.transformOrigin = '0 0';
  w.append(c);
  if(opt.click){ w.dataset.act = 'page-click'; w.dataset.idx = idx; w.tabIndex = 0; w.setAttribute('role', 'button'); w.setAttribute('aria-label', pageText(P) + ', 눌러서 원고 고치기'); }
  return w;
}
function pageText(P){ return `${P.recto ? '오른쪽 면' : '왼쪽 면'}${P.folio != null ? ` · ${P.folio}쪽` : ''}`; }
function labelEl(P){
  const d = document.createElement('div'); d.className = 'plabel';
  d.innerHTML = `<span>${pageText(P)}${P.folio != null && !P.showFolio ? ' (번호 숨김)' : ''}</span>${KIND_BADGE[P.kind] ? `<span class="chip ${P.kind === 'opener' ? 'acc' : P.kind === 'pad' || P.kind === 'blank' ? 'warn' : ''}">${KIND_BADGE[P.kind]}</span>` : ''}`;
  return d;
}
function spreadEl(L, si, s, opt = {}){
  const row = document.createElement('div'); row.className = 'spread' + (opt.stack ? ' stack' : '');
  const [a, b] = L.spreads[si] || [null, null];
  for(const [idx, side] of [[a, 'verso'], [b, 'recto']]){
    if(opt.stack && idx == null) continue;
    const col = document.createElement('div'); col.className = 'side ' + side;
    if(idx == null){ const e = document.createElement('div'); e.className = 'pw none'; e.style.width = L.D.W * s + 'px'; e.style.height = L.D.H * s + 'px'; col.append(e); if(opt.labels){ const l = document.createElement('div'); l.className = 'plabel'; l.textContent = side === 'verso' ? '표지 안쪽' : '뒤표지 안쪽'; col.append(l); } }
    else { col.append(pageSlot(L, idx, s, opt)); if(opt.labels) col.append(labelEl(L.pages[idx])); }
    row.append(col);
  }
  return row;
}
function mountSpread(box, si, {maxScale = 1, maxH = 0, labels = false, click = false, allowStack = false} = {}){
  if(!box) return; const L = getLayout(); box.innerHTML = '';
  const avail = Math.max(200, box.clientWidth - 8);
  const stack = allowStack && avail < 560;
  let s = stack ? Math.min(maxScale, avail / L.D.W) : Math.min(maxScale, avail / (2 * L.D.W));
  if(maxH) s = Math.min(s, maxH / L.D.H);
  box.append(spreadEl(L, Math.max(0, Math.min(si, L.spreads.length - 1)), s, {labels, click, stack}));
}

/* ---- ④ 미리보기 ---- */
function previewView(){
  afterRender = () => {
    const L = getLayout(); S.spread = Math.max(0, Math.min(S.spread, L.spreads.length - 1));
    const stage = document.getElementById('pstage'); stage.classList.toggle('gray', S.gray); stage.classList.toggle('guides', S.guides);
    mountSpread(stage, S.spread, {maxScale:1.05, labels:true, click:true, allowStack:true});
    document.getElementById('pcount').textContent = `${S.spread + 1} / ${L.spreads.length} 펼침면`;
    document.getElementById('ptotal').textContent = `총 ${L.total}쪽`;
    const th = document.getElementById('thumbs'); th.innerHTML = '';
    L.spreads.forEach((sp, si) => {
      const b = document.createElement('button'); b.className = 'thumb'; b.dataset.act = 'spread'; b.dataset.v = si; b.setAttribute('aria-current', String(si === S.spread));
      b.append(spreadEl(L, si, 64 / L.D.H));
      const f = sp.map(i => i == null ? '' : (L.pages[i].folio ?? '·')).filter(x => x !== '').join('–');
      const lab = document.createElement('span'); lab.textContent = f || '·'; b.append(lab); th.append(b);
    });
    const cur = th.children[S.spread]; if(cur) th.scrollLeft = cur.offsetLeft - th.clientWidth / 2 + cur.clientWidth / 2;
  };
  return `<section class="stage">
    <div class="stage-top">
      <div class="navbar"><button class="btn" data-act="flip" data-d="-1" aria-label="앞 펼침면">‹ 앞</button><span class="count" id="pcount"></span><button class="btn" data-act="flip" data-d="1" aria-label="다음 펼침면">다음 ›</button><span class="chip" id="ptotal"></span></div>
      <div class="navbar"><label class="small"><input type="checkbox" data-bind="gray" ${S.gray ? 'checked' : ''}> 흑백으로 보기</label><label class="small"><input type="checkbox" data-bind="guides" ${S.guides ? 'checked' : ''}> 여백 안내선</label><button class="btn" data-act="edit-here">이 쪽 원고 고치기</button></div>
    </div>
    <div id="pstage"></div>
    <div class="thumbs" id="thumbs" aria-label="펼침면 목록"></div>
    <div class="legend"><span class="chip acc">장 시작 면</span><span class="chip warn">빈 면 · 장을 오른쪽에서 시작하려고 넣은 면</span><span class="chip warn">인쇄용 빈 면 · 총 쪽수를 4의 배수로</span><span class="chip">왼쪽 면 = 짝수 쪽, 오른쪽 면 = 홀수 쪽</span></div>
  </section>
  <p class="muted small">쪽을 누르면 그 자리 원고로 가요. 키보드 ← → 로도 넘길 수 있어요.</p>
  <div class="foot"><button class="btn" data-act="go" data-v="design">← 책 꾸미기</button><button class="btn primary" data-act="next" data-v="check">점검하고 내보내기 →</button></div>`;
}

/* ---- ⑤ 점검·내보내기 ---- */
function effDpi(b, D){ const art = ARTS[b.art]; const wmm = b.size === 'half' ? D.bodyWmm / 2 : b.size === 'full' ? Math.min(D.bodyWmm, (D.bodyHmm - 10) / art.ratio) : D.bodyWmm; return Math.round(art.px / (wmm / 25.4)); }
function runChecks(L){
  const stop = [], warn = [], ok = [];
  const where = s => { const i = L.secFirst[s.id]; const f = i != null ? L.pages[i].folio : null; return `${secLabel(s)}${f != null ? ` · ${f}쪽부터` : ''}`; };
  for(const s of S.sections){
    const txt = s.blocks.map(b => (b.text || '').replace(/\{\{n\d+\}\}/g, '')).join('').trim();
    if(!txt && s.kind !== 'part' && !s.blocks.some(b => b.t === 'img')) stop.push({msg:`‘${secLabel(s)}’에 글이 없어요`, hint:'글을 쓰거나 차례에서 지워 주세요.', sec:s.id, where:where(s)});
    const emo = txt.match(/\p{Extended_Pictographic}/gu);
    if(emo){ const bi = s.blocks.findIndex(b => /\p{Extended_Pictographic}/u.test(b.text || '')); stop.push({msg:`서체에 없는 글자가 있어요: ${[...new Set(emo)].join(' ')}`, hint:'인쇄하면 빈 네모(□)로 나와요. 지우거나 ‘하트’처럼 글로 바꿔 주세요.', sec:s.id, bi, where:where(s)}); }
    s.blocks.forEach((b, bi) => {
      if(b.t !== 'img') return; const dpi = effDpi(b, L.D);
      if(dpi < 300) warn.push({msg:`‘${b.caption || '그림'}’ 사진이 인쇄하면 ${dpi < 150 ? '많이 ' : ''}흐릿할 수 있어요 (${dpi}dpi)`, hint:b.size !== 'half' && dpi * 2 >= 300 ? `반 폭으로 줄이면 ${dpi * 2}dpi가 돼서 선명해요.` : '더 큰 사진 파일로 바꿔 주세요.', sec:s.id, bi, where:where(s), fix:b.size !== 'half' && dpi * 2 >= 300 ? {act:'fix-half', id:s.id, i:bi, label:'반 폭으로 바꾸기'} : null});
    });
    if(S.design.notes === 'page') for(const id of L.notesBySec[s.id] || []) if((S.notes[id] || '').length > 150) warn.push({msg:`${secLabel(s)}의 ${L.noteNo[id]}번 주석이 길어요`, hint:'쪽 아래에 긴 주석이 있으면 본문이 짧아져요. 책 끝 주석으로 바꾸면 읽기 편해요.', sec:s.id, where:where(s), fix:{act:'fix-booknotes', label:'책 끝 주석으로 바꾸기'}});
  }
  if(L.pad) warn.push({msg:`인쇄를 위해 끝에 빈 면 ${L.pad}쪽을 더했어요 (총 ${L.total}쪽)`, hint:'책은 4쪽 단위로 인쇄해요. 빈 면이 싫으면 작가 소개나 감사의 글을 더해 보세요.'});
  else ok.push({msg:`총 ${L.total}쪽, 4쪽 단위로 딱 맞아요`});
  const st = L.stats;
  if(st.orphans + st.widows) ok.push({msg:`문단의 한 줄만 쪽을 넘어가는 곳 ${st.orphans + st.widows}곳을 자동으로 피했어요`, term:'과부·고아 줄'});
  if(st.keep) ok.push({msg:`쪽 끝에 홀로 남은 소제목 ${st.keep}개를 다음 쪽으로 옮겼어요`});
  if(st.blanks) ok.push({msg:`장이 오른쪽 면에서 시작하도록 빈 면 ${st.blanks}쪽을 넣었어요`});
  if(st.deferred) ok.push({msg:`자리가 모자란 그림 ${st.deferred}개를 다음 쪽 맨 위로 옮겼어요`});
  if(!stop.some(i => i.msg.startsWith('서체에 없는'))) ok.push({msg:'모든 글자를 서체로 그릴 수 있어요'});
  return {stop, warn, ok};
}
function checkView(){
  const L = getLayout(); const R = runChecks(L); const D = L.D;
  const item = (cls, it) => `<div class="issue ${cls}"><span class="dot"></span><div><div>${esc(it.msg)}${it.term ? ` <span class="term" tabindex="0" data-term="${it.term}">?</span>` : ''}</div>${it.where ? `<div class="where">${esc(it.where)}</div>` : ''}${it.hint ? `<div class="hint">${esc(it.hint)}</div>` : ''}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${it.fix ? `<button class="btn small" data-act="${it.fix.act}" data-id="${it.fix.id || ''}" data-i="${it.fix.i ?? ''}">${it.fix.label}</button>` : ''}${it.sec ? `<button class="btn small" data-act="goto" data-id="${it.sec}" data-i="${it.bi ?? ''}">그 자리로 가기</button>` : ''}</div></div>`;
  const blocked = R.stop.length > 0;
  const fname = (S.meta.title || '책').replace(/\s+/g, '');
  const out = (k, title, rows, desc) => {
    const st = S.exp[k];
    return `<div class="out"><b>${title}</b><span class="muted small">${desc}</span><dl>${rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>
      ${k === 'print' ? `<label class="small"><input type="checkbox" data-bind="crop" ${S.cropMarks ? 'checked' : ''}> 재단선 표시</label>` : ''}
      ${st === 'working' ? '<div class="bar"><i></i></div><span class="muted small">PDF를 만들고 있어요…</span>' : st === 'done' ? `<div class="ready">준비됐어요 · ${esc(fname)}_${k === 'print' ? '인쇄용' : '확인용'}.pdf<br><span class="small">목업이라 실제 파일은 만들지 않아요.</span></div>` : ''}
      <button class="btn ${k === 'print' ? 'primary' : ''}" data-act="export" data-v="${k}" ${blocked || st === 'working' ? 'disabled' : ''}>${st === 'done' ? '다시 만들기' : k === 'print' ? '인쇄용 PDF 만들기' : '확인용 PDF 만들기'}</button></div>`;
  };
  return `<div class="check-grid">
  <section class="panel">
    <p class="lead">${blocked ? `고쳐야 할 곳이 ${R.stop.length}곳 있어요` : '인쇄할 준비가 됐어요'}</p>
    <p class="muted" style="margin:0 0 16px">확인할 곳 ${R.warn.length}곳은 그대로 두어도 PDF를 만들 수 있어요.</p>
    ${R.stop.length ? `<div class="grp"><span class="chip stop">고쳐야 해요</span></div>${R.stop.map(i => item('stop', i)).join('')}` : ''}
    ${R.warn.length ? `<div class="grp"><span class="chip warn">확인해 보세요</span></div>${R.warn.map(i => item('warn', i)).join('')}` : ''}
    <div class="grp"><span class="chip ok">알아서 했어요</span></div>${R.ok.map(i => item('ok', i)).join('')}
  </section>
  <section class="panel export">
    <h2 class="sec-title">내보내기</h2>
    ${blocked ? '<div class="issue stop" style="margin:0"><span class="dot"></span><div>고쳐야 할 곳을 먼저 고쳐 주세요. 고치면 바로 PDF를 만들 수 있어요.</div><span></span></div>' : ''}
    ${out('print', '인쇄용 PDF', [['크기', `${D.t.name} ${D.t.w}×${D.t.h}mm + 사방 3mm 인쇄 여유분`], ['쪽', `낱쪽 ${L.total}쪽`], ['글자', '모양 그대로 고정 (서체 파일 필요 없음)'], ['그림', '원본 해상도 그대로']], '인쇄소나 주문형 인쇄(POD)에 넘기는 파일이에요.')}
    ${out('proof', '확인용 PDF', [['모양', '펼침면 (두 쪽씩)'], ['쪽', `${L.spreads.length}개 펼침면`]], '가족이나 편집자에게 보여 주는 파일이에요.')}
    <p class="muted small" style="margin:0">책등 두께와 표지는 표지 만들기에서 이 책의 쪽수(${L.total}쪽)로 맞춰요.</p>
  </section></div>
  <div class="foot"><button class="btn" data-act="go" data-v="preview">← 미리보기</button><button class="btn" data-act="go" data-v="studio">책 작업실에서 고치기</button></div>`;
}

/* ---- 책 작업실 ---- */
function edInline(t, nums){ return esc(t).replace(/\{\{(n\d+)\}\}/g, (_, id) => `<sup class="nref" contenteditable="false" data-id="${id}" title="주석 ${nums[id] ?? ''}">${nums[id] ?? '*'}</sup>`); }
function secNoteNums(sec){ const m = {}; let c = 0; for(const b of sec.blocks) for(const id of refsIn(b.text || '')) if(!(id in m)) m[id] = ++c; return m; }
function studioView(){
  if(!S.sections.find(s => s.id === S.sel)) S.sel = S.sections[0]?.id;
  const sec = S.sections.find(s => s.id === S.sel);
  const nums = sec ? secNoteNums(sec) : {};
  const D = dims();
  afterRender = () => {
    const L = getLayout(); const box = document.getElementById('mini');
    if(box && sec && L.secFirst[sec.id] != null) mountSpread(box, spreadOf(L.secFirst[sec.id]), {maxH:200});
    if(S.focusBlock != null){ const el = view.querySelector(`.eb[data-i="${S.focusBlock}"]`); if(el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); } S.focusBlock = null; }
  };
  const blockHTML = (b, i) => {
    if(b.t === 'p') return `<div class="eb ed-p" contenteditable="true" data-i="${i}" spellcheck="false">${edInline(b.text, nums)}</div>`;
    if(b.t === 'q') return `<div class="eb ed-q" contenteditable="true" data-i="${i}" spellcheck="false">${edInline(b.text, nums)}</div>`;
    if(b.t === 'h') return `<div class="eb ed-h ${b.weak ? 'weakh' : ''}" contenteditable="true" data-i="${i}" spellcheck="false">${edInline(b.text, nums)}</div>`;
    if(b.t === 'break') return `<div class="eb ed-br" data-i="${i}">* * *<button class="btn ghost small del" data-act="blk-del" data-i="${i}" aria-label="장면 바꿈 지우기">✕</button></div>`;
    if(b.t === 'img'){ const dpi = effDpi(b, D); return `<figure class="eb ed-img" data-i="${i}"><div class="art" style="background-image:url('${ARTS[b.art].uri}')"></div><div class="ctl2">
      <div class="seg" role="group" aria-label="그림 크기">${[['body','본문 폭'],['half','반 폭'],['full','한 면 전체']].map(([v, l]) => `<button type="button" data-act="img-size" data-i="${i}" data-v="${v}" aria-pressed="${b.size === v}">${l}</button>`).join('')}</div>
      <input aria-label="그림 설명" data-bind="img-cap" data-i="${i}" value="${esc(b.caption || '')}" placeholder="그림 설명 (없어도 돼요)">
      <span><span class="chip ${dpi < 150 ? 'stop' : dpi < 300 ? 'warn' : 'ok'}">인쇄 해상도 ${dpi}dpi</span> <span class="muted small">${dpi < 300 ? '인쇄하면 흐릿할 수 있어요' : '선명하게 인쇄돼요'}</span></span>
      </div><button class="btn ghost small del" data-act="blk-del" data-i="${i}" aria-label="그림 지우기">✕</button></figure>`; }
    return '';
  };
  const ids = sec ? Object.keys(nums) : [];
  return `<div class="appbar"><div class="crumb"><button class="btn ghost small" data-act="go" data-v="library">← 내 책</button><span class="bk">${esc(S.meta.title)} · 책 작업실</span></div>
    <div class="navbar"><button class="btn small" data-act="go" data-v="design">책 꾸미기</button><button class="btn small" data-act="go" data-v="preview">미리보기</button><button class="btn small primary" data-act="go" data-v="check">점검·내보내기</button></div></div>
  <div class="studio">
    <aside class="st-toc" aria-label="차례">${['front','body','back'].map(z => `<div class="z">${ZONES[z]}</div>${S.sections.filter(s => zoneOf(s) === z).map(s => `<button class="it" data-act="st-sel" data-id="${s.id}" aria-current="${s.id === S.sel}"><span>${esc(secLabel(s))}</span></button>`).join('')}`).join('')}
      <button class="btn small" style="margin-top:10px" data-act="st-add">+ 장 더하기</button></aside>
    <section class="panel" style="min-width:0">${sec ? `
      <div class="st-head"><span class="chip">${KINDS[sec.kind].label}${chapterNo(sec) ? ' ' + chapterNo(sec) : ''}</span><input aria-label="제목" data-bind="st-title" value="${esc(sec.title)}"></div>
      <div class="toolbar" role="toolbar" aria-label="원고 도구">
        <button class="btn small" data-act="tb" data-v="h">소제목</button><button class="btn small" data-act="tb" data-v="p">본문</button><button class="btn small" data-act="tb" data-v="q">인용</button><span class="sep"></span>
        <button class="btn small" data-act="tb" data-v="break">장면 바꿈</button><button class="btn small" data-act="tb" data-v="img">그림 넣기</button><button class="btn small" data-act="tb" data-v="note">주석 넣기</button>
      </div>
      <div class="ed" id="ed">${sec.blocks.length ? sec.blocks.map(blockHTML).join('') : ''}</div>
      ${sec.blocks.length ? '' : '<p class="muted">아직 글이 없어요. <button class="btn small" data-act="add-p">문단 쓰기</button></p>'}
      <p class="muted small" style="margin-top:14px">Enter로 문단을 나눠요. 글자 모양은 책 디자인이 정하므로 여기서는 고르지 않아요.</p>` : ''}
    </section>
    <aside>
      <div class="panel" style="padding:14px;margin-bottom:12px"><h2 class="sec-title">이 장의 주석 ${ids.length ? `<span class="chip">${ids.length}</span>` : ''}</h2>
        <div class="notes-panel">${ids.length ? ids.map(id => `<div class="note"><span class="no">${nums[id]}</span><textarea aria-label="주석 ${nums[id]}" data-bind="note" data-id="${id}" placeholder="주석 내용">${esc(S.notes[id] || '')}</textarea></div>`).join('') : '<span class="muted small">주석을 넣을 글자 뒤에 커서를 두고 ‘주석 넣기’를 누르세요.</span>'}</div>
        <span class="muted small">주석 위치: <b>${{page:'쪽 아래', chapter:'장 끝', book:'책 끝'}[S.design.notes]}</b> (책 꾸미기에서 바꿔요)</span></div>
      <div class="panel" style="padding:14px"><h2 class="sec-title">이 장의 첫 펼침면</h2><div class="mini" id="mini"></div>
        <button class="btn small" style="margin-top:10px" data-act="mini-open">미리보기에서 보기</button></div>
    </aside>
  </div>`;
}

/* ---- 기획 요약 ---- */
function planView(){
  return `<article class="plan">
  <p class="muted small" style="margin:0">책 만들기 서비스 기획 · 2026-10-11 · 방향 승인됨, 기획서 검토 중</p>
  <h1>원고를 책으로</h1>
  <p>글을 다 쓴 일반 작가가 원고만 넣으면 인쇄소에 넘길 수 있는 <b>책 내지 PDF</b>를 얻는 서비스다. 서비스가 차례를 만들고 장을 나누고, 장 시작 면·여는 글/닫는 글·쪽 번호·머리글·홀수/짝수 면 규칙·그림·주석을 알아서 배치한다. 표지와 전자책은 범위 밖이다.</p>
  <div class="kpi"><div><b>첫 책 작가가 혼자 끝낸다</b><span>도움말 없이 원고 넣기 → PDF까지, 원고 200쪽 기준 20분 이내</span></div><div><b>모르는 말이 없다</b><span>화면에는 쉬운 말만, 출판 용어는 툴팁으로</span></div><div><b>미리보기 = 인쇄물</b><span>같은 엔진(kayak), 같은 폰트, 같은 쪽 나눔</span></div><div><b>인쇄소 기준을 맞춘다</b><span>재단 여백 3mm, 글자 아웃라인, 4의 배수 쪽, 300dpi 경고</span></div></div>

  <h2>사용자 흐름 — 단계 안내 → 책 작업실</h2>
  <p>처음에는 다섯 단계를 순서대로 안내하고, 단계마다 기본값이 채워져 있어 ‘다음’만 눌러도 끝까지 간다. 한 번 끝까지 간 책은 책 작업실(차례 · 원고 · 펼침면)에서 고친다.</p>
  <div class="tbl"><table><tr><th>단계</th><th>작가</th><th>서비스</th></tr>
    <tr><td>1 원고 넣기</td><td>제목·지은이, 책 크기, 붙여넣기 / .docx / 직접 쓰기</td><td>원고를 블록(제목·문단·인용·그림·주석)으로</td></tr>
    <tr><td>2 차례 확인</td><td>장 순서·이름·종류 확인, 나누기·합치기</td><td>장 후보와 찾은 근거(제목 스타일, ‘제1장’ 패턴, 짧은 한 줄)</td></tr>
    <tr><td>3 책 꾸미기</td><td>디자인 프리셋, 글자 크기·줄 간격·서체, 쪽 번호·머리글, 주석 위치</td><td>견본 펼침면을 바로 다시 그림</td></tr>
    <tr><td>4 미리보기</td><td>펼침면을 넘겨 보고, 고칠 쪽을 누름</td><td>전체 조판, 빈 면·장 시작 면 표시</td></tr>
    <tr><td>5 점검·내보내기</td><td>점검 결과 확인, PDF 받기</td><td>고쳐야 해요 / 확인해 보세요 / 알아서 했어요</td></tr></table></div>

  <h2>책 구조와 쪽 규칙</h2>
  <div class="tbl"><table><tr><th>구역</th><th>부분</th><th>규칙</th></tr>
    <tr><td>앞부분</td><td>속표지, 판권 면, 헌사, 차례, 여는 글</td><td>쪽 번호 숨김(선택: i, ii, iii). 판권 면은 속표지 뒷면</td></tr>
    <tr><td>본문</td><td>부 표지, 장(소제목 2단계까지)</td><td>장은 오른쪽 면에서 시작, 장 시작 면에는 머리글·쪽 번호 없음. 본문 첫 쪽이 1쪽</td></tr>
    <tr><td>뒷부분</td><td>닫는 글, 감사의 글, 책 끝 주석, 작가 소개</td><td>오른쪽 면 시작, 쪽 번호는 본문에서 이어짐</td></tr></table></div>
  <ul><li>장 시작을 오른쪽에 맞추려고 넣은 빈 면에는 쪽 번호·머리글을 넣지 않는다.</li><li>머리글: 왼쪽 면은 책 제목, 오른쪽 면은 장 제목. 쪽 번호는 바깥쪽 아래가 기본.</li><li>문단의 한 줄만 쪽 끝·쪽 처음에 남지 않게(최소 2줄), 소제목은 다음 문단 두 줄과 같은 쪽에.</li><li>주석 위치는 책 전체에 하나(쪽 아래 / 장 끝 / 책 끝), 번호는 장마다 1부터.</li><li>그림은 본문 폭 / 반 폭 / 한 면 전체. 자리가 없으면 다음 쪽 맨 위로 미루고 뒤 글로 빈자리를 채운다.</li><li>총 쪽수가 4의 배수가 아니면 끝에 빈 면을 더하고 점검에서 알린다.</li></ul>

  <h2>시스템 구조</h2>
  <div class="flowline"><div class="bx"><b>원고 변환기</b><span>docx · 붙여넣기 · 편집기 → 블록</span></div><span class="ar">→</span><div class="bx"><b>Book JSON</b><span>구역·부분·블록 + 디자인 이름값</span></div><span class="ar">→</span><div class="bx new"><b>조판기 (새로)</b><span>쪽 나누기, 주석 자리, 빈 면, 머리글</span></div><span class="ar">→</span><div class="bx"><b>쪽 목록</b><span>쪽마다 놓인 조각</span></div><span class="ar">→</span><div class="bx"><b>렌더러</b><span>kayak SVG → 화면 / Node PDF</span></div></div>
  <p>장은 늘 새 쪽에서 시작하므로 장의 조판 결과는 다른 장과 무관하다. 원고를 고치면 그 장만 다시 조판하고 이후 장은 쪽 번호와 빈 면만 다시 매긴다.</p>

  <h2>kayak에 필요한 것</h2>
  <p>지금 kayak은 텍스트 상자 하나를 편집·렌더링하는 엔진이다. 이 서비스가 로드맵의 공개 API 재설계(#1)와 영역/흐름(#2)의 구체적인 요구사항이 된다.</p>
  <div class="tbl"><table><tr><th></th><th>필요</th><th>지금</th><th>방법</th></tr>
    <tr><td>K1</td><td>문단의 글줄 나눔 결과(범위·높이·기준선)</td><td>상자 높이만 공개, 글줄은 내부</td><td>새 API의 ‘측정’ 기능</td></tr>
    <tr><td>K2</td><td>글줄 범위만 렌더</td><td>상자 전체 SVG</td><td>처음엔 K1 위치로 SVG를 잘라 씀, 이후 영역/흐름</td></tr>
    <tr><td>K3</td><td>주석 참조 위치 → 글줄</td><td>이름 붙은 범위, 위치 찾기 있음</td><td>참조를 이름 붙은 범위로 표시</td></tr>
    <tr><td>K4</td><td>주석 번호 위첨자</td><td>기준선 이동 속성 없음</td><td>새 글자 속성(별도 설계)</td></tr>
    <tr><td>K5</td><td>굵게·기울임 강조</td><td>bold는 SVG에서 효과 없음, 기울임 없음</td><td>서체의 Bold/Italic 스타일로 적용</td></tr>
    <tr><td>K6</td><td>한글 금칙</td><td>공백 기준 어절 줄바꿈, 금칙 코드 없음</td><td>문장부호 경우 확인 후 필요하면 추가</td></tr>
    <tr><td>K7</td><td>Node에서 폰트 실패가 오류로</td><td>Promise가 끝나지 않음, alert 경로</td><td>PDF 서버 전에 고침(결함 수정)</td></tr></table></div>

  <h2>첫 출시 범위</h2>
  <div class="tbl"><table><tr><th>첫 출시</th><th>나중에</th></tr>
    <tr><td>붙여넣기·.docx·단순 편집기, 장 자동 인식, 프리셋 3개(에세이·소설·실용), 홀수/짝수 면 규칙, 주석 3가지 위치, 그림 3가지 크기, 펼침면 미리보기, 인쇄 전 점검, 인쇄용·확인용 PDF</td>
    <td>프리셋 추가(여행·사진, 시집), 세밀한 스타일 편집, .hwpx, 다단, 표, 색인, 쪽 아래 주석 두 쪽 나누기, EPUB, 표지 서비스 연결</td></tr></table></div>

  <h2>열린 질문</h2>
  <ol><li>한글 서체에 기울임이 없을 때 기울임 강조를 어떻게 보여 줄까 (대체 서체 / 밑줄 / 무시)</li><li>판권 면의 ISBN·펴낸 곳은 작가 입력인가, 인쇄 주문 서비스 연동인가</li><li>쪽 아래 주석을 두 쪽에 나누는 기능의 시기</li><li>SVG → PDF 변환 도구와 그림 색 처리</li><li>앱 위치: kayak2의 <code>apps/book</code> 또는 별도 저장소</li></ol>
  <p class="muted small">전체 기획서: kayak2 저장소 <code>docs/specs/2026-10-11-book-service-design.md</code> (브랜치 <code>plan/book-service</code>)</p>
  <p class="muted small">목업의 미리보기는 브라우저 글꼴로 흉내 낸 조판이다. 실제 서비스는 같은 규칙을 kayak 측정·렌더 위에서 돌린다.</p>
  </article>`;
}

/* ===================== 동작 ===================== */
let toastTimer = null;
function toast(msg, undo){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" data-act="undo">되돌리기</button>' : ''}`;
  document.body.append(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 4200);
}
const secById = id => S.sections.find(s => s.id === id);
const curSec = () => secById(S.sel);
function serialize(el){
  let out = '';
  el.childNodes.forEach(n => { if(n.nodeType === 3) out += n.textContent; else if(n.matches?.('sup.nref')) out += `{{${n.dataset.id}}}`; else if(n.nodeName === 'BR') out += ' '; else out += serialize(n); });
  return out;
}
const clean = t => t.replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
let previewTimer = null;
function schedulePreview(){ clearTimeout(previewTimer); previewTimer = setTimeout(() => { invalidate(); refreshPreviews(); }, 350); }
function splitSection(sec, i){
  const rest = sec.blocks.splice(i); let title = '새 장';
  if(rest[0] && rest[0].t === 'h'){ title = rest.shift().text; }
  const ns = {id:uid(), kind:'chapter', title, reason:'직접 나눔', blocks:rest};
  S.sections.splice(S.sections.indexOf(sec) + 1, 0, ns); normalize(); S.sel = ns.id; invalidate();
}

const ACT = {
  mode:a => { S.mode = a.dataset.v; window.scrollTo(0, 0); render(); },
  go:a => { const v = a.dataset.v; if(STEPS.some(s => s.id === v)) stepTo(v); else { S.view = v; window.scrollTo(0, 0); render(); } },
  next:a => stepTo(a.dataset.v),
  toast:a => toast(a.dataset.msg),
  newbook:() => { S.view = 'input'; S.furthest = 0; S.inTab = 'paste'; S.docxName = null; S.msDraft = null; S.exp = {print:'idle', proof:'idle'}; render(); },
  trim:a => { S.trim = a.dataset.v; invalidate(); render(); },
  intab:a => { const ta = document.getElementById('ms'); if(ta) S.msDraft = ta.value; S.inTab = a.dataset.v; render(); },
  read:() => {
    let raw, src = S.inTab;
    if(src === 'paste'){ raw = document.getElementById('ms').value; S.msDraft = raw; if(!raw.trim()){ toast('원고를 붙여넣어 주세요'); return; } }
    else raw = SAMPLE;
    loadBook(raw, src);
    if(src === 'docx'){ const h = S.sections.flatMap(s => s.blocks).find(b => b.t === 'img' && b.art === 'harbor'); if(h) h.size = 'full'; }
    toast(`장 ${S.sections.filter(s => s.kind === 'chapter').length}개를 찾았어요`); stepTo('toc');
  },
  write:() => { S.sections = [{id:uid(), kind:'prologue', title:'여는 글', reason:'직접 추가', blocks:[]}, {id:uid(), kind:'chapter', title:'첫 번째 장', reason:'직접 추가', blocks:[{t:'p', text:''}]}]; S.notes = {}; S.sel = S.sections[1].id; S.furthest = 2; invalidate(); S.view = 'studio'; render(); },
  'toc-sel':(a, e) => { if(e.target.closest('select,input,button')) return; S.sel = a.dataset.id; render(); },
  mv:a => { const s = secById(a.dataset.id), d = +a.dataset.d; const zl = S.sections.filter(x => zoneOf(x) === zoneOf(s)); const j = zl.indexOf(s) + d; if(j < 0 || j >= zl.length) return; const o = zl[j]; const ia = S.sections.indexOf(s), ib = S.sections.indexOf(o); S.sections[ia] = o; S.sections[ib] = s; invalidate(); render(); },
  merge:a => { const s = secById(a.dataset.id); const i = S.sections.indexOf(s); if(i <= 0) return; const p = S.sections[i - 1]; p.blocks.push({t:'h', text:s.title}, ...s.blocks); S.sections.splice(i, 1); S.sel = p.id; invalidate(); toast(`‘${s.title}’을 ‘${p.title}’에 합쳤어요`); render(); },
  'sec-del':a => { const s = secById(a.dataset.id); const i = S.sections.indexOf(s); S.lastDeleted = {s, i}; S.sections.splice(i, 1); if(S.sel === s.id) S.sel = S.sections[0]?.id; invalidate(); render(); toast(`‘${s.title}’을 지웠어요`, true); },
  undo:() => { const d = S.lastDeleted; if(!d) return; S.sections.splice(d.i, 0, d.s); S.lastDeleted = null; invalidate(); render(); document.querySelector('.toast')?.remove(); },
  split:a => { splitSection(secById(a.dataset.id), +a.dataset.i); toast('새 장을 만들었어요. 제목을 확인해 주세요'); render(); },
  'weak-ch':a => { splitSection(secById(a.dataset.id), +a.dataset.i); render(); },
  'weak-keep':a => { secById(a.dataset.id).blocks[+a.dataset.i].weak = false; render(); },
  preset:a => { S.design.preset = a.dataset.v; S.design.font = PRESETS[a.dataset.v].font; invalidate(); render(); },
  set:a => { S.design[a.dataset.k] = a.dataset.v; invalidate(); render(); },
  toggle:a => { S.design[a.dataset.k] = !S.design[a.dataset.k]; invalidate(); render(); },
  dfocus:a => { S.designFocus = a.dataset.v; render(); },
  flip:a => { const L = getLayout(); S.spread = Math.max(0, Math.min(L.spreads.length - 1, S.spread + +a.dataset.d)); refreshPreviews(); },
  spread:a => { S.spread = +a.dataset.v; refreshPreviews(); },
  'page-click':a => openPageInStudio(+a.dataset.idx),
  'edit-here':() => { const L = getLayout(); const [x, y] = L.spreads[S.spread]; const idx = [y, x].find(i => i != null && L.pages[i].sec && !L.pages[i].sec.startsWith('gen')); if(idx != null) openPageInStudio(idx); else toast('이 펼침면은 서비스가 만든 쪽이에요. 책 정보나 책 꾸미기에서 바꿔요'); },
  goto:a => { S.sel = a.dataset.id; S.focusBlock = a.dataset.i === '' ? null : +a.dataset.i; S.view = 'studio'; window.scrollTo(0, 0); render(); },
  'fix-half':a => { secById(a.dataset.id).blocks[+a.dataset.i].size = 'half'; invalidate(); toast('사진을 반 폭으로 바꿨어요'); render(); },
  'fix-booknotes':() => { S.design.notes = 'book'; invalidate(); toast('주석을 책 끝에 모았어요'); render(); },
  export:a => { const k = a.dataset.v; S.exp[k] = 'working'; render(); setTimeout(() => { S.exp[k] = 'done'; if(S.view === 'check') render(); }, 1400); },
  'st-sel':a => { S.sel = a.dataset.id; render(); },
  'st-add':() => { const ns = {id:uid(), kind:'chapter', title:'새 장', reason:'직접 추가', blocks:[{t:'p', text:''}]}; const lastBody = S.sections.filter(s => zoneOf(s) === 'body').pop(); S.sections.splice(lastBody ? S.sections.indexOf(lastBody) + 1 : S.sections.length, 0, ns); S.sel = ns.id; invalidate(); render(); },
  'add-p':() => { curSec().blocks.push({t:'p', text:''}); S.focusBlock = 0; invalidate(); render(); },
  'mini-open':() => { const L = getLayout(); const i = L.secFirst[S.sel]; S.spread = i != null ? spreadOf(i) : 0; stepTo('preview'); },
  'blk-del':a => { curSec().blocks.splice(+a.dataset.i, 1); invalidate(); render(); },
  'img-size':a => { curSec().blocks[+a.dataset.i].size = a.dataset.v; invalidate(); render(); },
  tb:a => {
    const sec = curSec(); if(!sec) return; const v = a.dataset.v; let i = S.edFocus;
    if(v === 'note') return insertNote();
    if(i == null || i >= sec.blocks.length) i = sec.blocks.length - 1;
    const b = sec.blocks[i];
    if(v === 'h' || v === 'p' || v === 'q'){ if(!b || !('text' in b)){ toast('글 문단을 먼저 눌러 주세요'); return; } b.t = v === 'q' && b.t === 'q' ? 'p' : v; b.weak = false; }
    else if(v === 'break') sec.blocks.splice(i + 1, 0, {t:'break'});
    else if(v === 'img'){ const art = ART_ORDER[(artSeq++) % 3]; sec.blocks.splice(i + 1, 0, {t:'img', art, size:'body', caption:''}); toast('예시 사진을 넣었어요. 실제 서비스에서는 사진 고르는 창이 열려요'); S.focusBlock = i + 1; }
    invalidate(); render();
  },
};
function insertNote(){
  const sec = curSec(); const r = S.savedRange;
  if(!r || !document.getElementById('ed')?.contains(r.startContainer)){ toast('주석을 넣을 글자 뒤에 커서를 두세요'); return; }
  const el = (r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement).closest('.eb[contenteditable="true"]'); if(!el) return;
  const id = 'n' + (++noteSeq); S.notes[id] = '';
  const sup = document.createElement('sup'); sup.className = 'nref'; sup.dataset.id = id; sup.contentEditable = 'false'; sup.textContent = '*';
  const rr = r.cloneRange(); rr.collapse(false); rr.insertNode(sup);
  sec.blocks[+el.dataset.i].text = clean(serialize(el));
  invalidate(); render();
  document.querySelector(`textarea[data-id="${id}"]`)?.focus();
}
function openPageInStudio(idx){
  const L = getLayout(); const P = L.pages[idx];
  if(!P.sec || P.sec.startsWith('gen')){ toast(P.kind === 'toc' || P.kind === 'title' || P.kind === 'copyright' ? '이 쪽은 서비스가 만들어요. 책 정보는 1단계에서 바꿔요' : '빈 면이에요. 고칠 원고가 없어요'); return; }
  S.sel = P.sec; S.view = 'studio'; window.scrollTo(0, 0); render(); toast(`${pageText(P)}의 원고예요`);
}

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if(!a || a.disabled) return;
  const f = ACT[a.dataset.act]; if(f) f(a, e);
});
document.addEventListener('mousedown', e => { if(e.target.closest('.toolbar button')) e.preventDefault(); });
document.addEventListener('keydown', e => {
  const a = e.target.closest?.('.pw.clickable'); if(a && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openPageInStudio(+a.dataset.idx); return; }
  const ed = e.target.closest?.('.eb[contenteditable="true"]');
  if(ed && e.key === 'Enter' && !e.isComposing){
    e.preventDefault(); const sec = curSec(); const i = +ed.dataset.i; const sel = getSelection(); if(!sel.rangeCount) return;
    const r = sel.getRangeAt(0); const pre = document.createRange(); pre.selectNodeContents(ed); pre.setEnd(r.startContainer, r.startOffset);
    const post = document.createRange(); post.selectNodeContents(ed); post.setStart(r.endContainer, r.endOffset);
    const box = document.createElement('div'); box.append(pre.cloneContents()); const before = clean(serialize(box));
    const box2 = document.createElement('div'); box2.append(post.cloneContents()); const after = clean(serialize(box2));
    sec.blocks[i].text = before; sec.blocks.splice(i + 1, 0, {t:sec.blocks[i].t === 'h' ? 'p' : sec.blocks[i].t, text:after});
    invalidate(); render(); const nx = view.querySelector(`.eb[data-i="${i + 1}"]`); if(nx){ nx.focus(); const rg = document.createRange(); rg.selectNodeContents(nx); rg.collapse(true); sel.removeAllRanges(); sel.addRange(rg); }
    return;
  }
  if(S.mode === 'proto' && S.view === 'preview' && !e.target.closest('input,textarea,[contenteditable="true"]')){
    if(e.key === 'ArrowRight') ACT.flip({dataset:{d:1}}); if(e.key === 'ArrowLeft') ACT.flip({dataset:{d:-1}});
  }
});
document.addEventListener('selectionchange', () => {
  const sel = getSelection(); if(!sel.rangeCount) return; const n = sel.anchorNode; const el = n && (n.nodeType === 1 ? n : n.parentElement)?.closest?.('#ed .eb');
  if(el){ S.savedRange = sel.getRangeAt(0).cloneRange(); S.edFocus = +el.dataset.i; }
});
document.addEventListener('focusin', e => { const el = e.target.closest?.('#ed .eb'); if(el) S.edFocus = +el.dataset.i; });
document.addEventListener('input', e => {
  const t = e.target; const bind = t.dataset?.bind;
  if(t.matches?.('.eb[contenteditable="true"]')){ const sec = curSec(); sec.blocks[+t.dataset.i].text = clean(serialize(t)); schedulePreview(); return; }
  if(!bind) return;
  if(bind === 'meta-title'){ S.meta.title = t.value; invalidate(); }
  else if(bind === 'meta-author'){ S.meta.author = t.value; invalidate(); }
  else if(bind === 'title'){ secById(t.dataset.id).title = t.value; invalidate(); }
  else if(bind === 'st-title'){ curSec().title = t.value; schedulePreview(); }
  else if(bind === 'note'){ S.notes[t.dataset.id] = t.value; schedulePreview(); }
  else if(bind === 'img-cap'){ curSec().blocks[+t.dataset.i].caption = t.value; schedulePreview(); }
});
document.addEventListener('change', e => {
  const t = e.target; const bind = t.dataset?.bind;
  if(bind === 'kind'){ secById(t.dataset.id).kind = t.value; normalize(); invalidate(); render(); }
  else if(bind === 'gray'){ S.gray = t.checked; refreshPreviews(); }
  else if(bind === 'guides'){ S.guides = t.checked; refreshPreviews(); }
  else if(bind === 'crop'){ S.cropMarks = t.checked; }
  else if(t.id === 'docx'){ const f = t.files?.[0]; S.docxName = f ? f.name : null; render(); }
});
document.addEventListener('dragover', e => { if(e.target.closest?.('.drop')) e.preventDefault(); });
document.addEventListener('drop', e => { const d = e.target.closest?.('.drop'); if(!d) return; e.preventDefault(); const f = e.dataTransfer.files?.[0]; if(f){ S.docxName = f.name; render(); } });
let rsTimer = null;
window.addEventListener('resize', () => { clearTimeout(rsTimer); rsTimer = setTimeout(refreshPreviews, 150); });

/* ===================== 시작 ===================== */
(async function boot(){
  loadBook(SAMPLE, 'docx');
  const h = S.sections.flatMap(s => s.blocks).find(b => b.t === 'img' && b.art === 'harbor'); if(h) h.size = 'full';
  render();
  try{
    const chars = [...new Set(SAMPLE + '차례주석지음초판쇄펴낸날곳입력전이책의내용을쓰려면허락받아야합니다0123456789ivx·.–')].join('');
    await Promise.race([Promise.all(['400','700','800'].map(w => document.fonts.load(`${w} 16px "Nanum Myeongjo"`, chars)).concat(['400','700'].map(w => document.fonts.load(`${w} 16px "Nanum Gothic"`, chars)))), new Promise(r => setTimeout(r, 3500))]);
  }catch(_){}
  invalidate(); render();
  let fTimer = null;
  document.fonts?.addEventListener?.('loadingdone', () => { clearTimeout(fTimer); fTimer = setTimeout(() => { invalidate(); refreshPreviews(); }, 200); });
})();
</script>
